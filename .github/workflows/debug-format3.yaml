name: Debug Format 3
on: [push]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
      - run: |
          for f in lib/models/generated/profile.freezed.dart lib/models/generated/profile.g.dart lib/models/profile.dart lib/common/mitm_manager.dart lib/providers/actions/core.dart lib/common/sr_import.dart test/common/mitm_profile_test.dart; do
            if dart format --output=none --set-exit-if-changed "$f" 2>&1; then
              echo "OK: $f"
            else
              echo "FAIL: $f"
            fi
          done
