name: Debug Format 5
on: [push]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
      - run: dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart > /tmp/format_out.txt 2>&1 || true
      - run: cat /tmp/format_out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: format-output
          path: /tmp/format_out.txt
